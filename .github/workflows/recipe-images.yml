name: Recipe photos

# Собирает фото для рецептов (recipes-app/tools/fetch_images.py)
# и сохраняет результат в репозиторий.
on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Сколько минут собирать (потом сохранить и остановиться)"
        default: "100"
  push:
    branches: [ccr-75b67d4e-vc2cwf]
    paths:
      - .github/workflows/recipe-images.yml
      - recipes-app/tools/fetch_images.py

permissions:
  contents: write
  actions: write   # чтобы запустить следующий заход, если собрано не всё

concurrency:
  group: recipe-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-75b67d4e-vc2cwf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch photos
        id: fetch
        run: python3 recipes-app/tools/fetch_images.py
        env:
          MAX_MINUTES: ${{ inputs.max_minutes || '100' }}
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes-app/data/images.js recipes-app/data/images-cache.json
          git diff --cached --quiet && { echo "Нет изменений"; exit 0; }
          git commit -m "Update recipe photos"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
      - name: Start next round if not finished
        if: always() && steps.fetch.outputs.left != '0' && steps.fetch.outputs.progress != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Осталось: ${{ steps.fetch.outputs.left }} — запускаю следующий заход"
          gh workflow run recipe-images.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
