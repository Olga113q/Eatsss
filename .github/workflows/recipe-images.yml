name: Recipe photos

# Собирает фото для рецептов (recipes-app/tools/fetch_images.py)
# и сохраняет результат в репозиторий.
on:
  workflow_dispatch:
  push:
    branches: [ccr-75b67d4e-vc2cwf]
    paths:
      - .github/workflows/recipe-images.yml
      - recipes-app/tools/fetch_images.py

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch photos
        run: python3 recipes-app/tools/fetch_images.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes-app/data/images.js recipes-app/data/images-cache.json
          git diff --cached --quiet && { echo "Нет изменений"; exit 0; }
          git commit -m "Update recipe photos"
          git push
