name: Probe stores (temporary)
on:
  push:
    branches: [ccr-75b67d4e-vc2cwf]
    paths: [probe/stores_probe.py, .github/workflows/probe-stores.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/stores_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p probe/out; git add probe/stores_result.json probe/out && git commit -m "Probe stores result (temporary)" && git pull --rebase origin "$GITHUB_REF_NAME" && git push
